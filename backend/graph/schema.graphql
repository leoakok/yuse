  trackedJobs: [TrackedJob!]!
  trackedJob(id: ID!): TrackedJob
  connectionStatus(provider: ConnectionProvider!): ConnectionStatus!
  """Admin only. Lists the knowledge dictionary entries."""
  knowledgeEntries(includeDisabled: Boolean = true): [KnowledgeEntry!]!
  """Admin only. Runs the cheap intent layer for a test message and returns the breakdown."""
  classifyAssistantMessage(text: String!, context: AssistantContextInput!): AssistantClassification!
  """Admin only. Lists all platform users."""
  adminUsers: [AdminUser!]!
  """Admin only. Lists beta waitlist entries."""
  adminWaitlist(status: WaitlistStatus): [WaitlistEntry!]!
  """Admin only. Lists recent admin audit log entries."""
  adminAuditLog(limit: Int = 50, offset: Int = 0): [AdminAuditLogEntry!]!
  """Admin only. Search LinkedIn geo locations by place name."""
  adminLinkedInGeoSearch(keywords: String!): [LinkedInGeoLocation!]!
  """Admin only. Ephemeral LinkedIn job search test. sessionCookie is used for this request only and is never stored."""
  adminLinkedInJobSearch(
    keywords: String
    geoId: String
    timeFilter: String = "r86400"
    sortBy: LinkedInJobSortBy = DATE_DESC
    maxResults: Int = 350
    workplaceTypes: [LinkedInWorkplaceType!]
    experienceLevels: [LinkedInExperienceLevel!]
    employmentTypes: [LinkedInEmploymentType!]
    easyApply: Boolean
    sessionCookie: String
  ): [LinkedInJobCard!]!
  """Admin only. Lists beta invite links."""
  adminInviteLinks: [InviteLink!]!
  """Admin only. Lists job search automations for the signed-in user."""
  jobAutomations: [JobAutomation!]!
  """Admin only. Fetches one job search automation."""
  jobAutomation(id: ID!): JobAutomation
  """Admin only. Recent runs for an automation."""
  automationRuns(automationId: ID!, limit: Int = 10, offset: Int = 0): [AutomationRun!]!
  """Admin only. Persisted matched jobs for an automation."""
  automationMatches(automationId: ID!, limit: Int = 50, offset: Int = 0, feedback: AutomationMatchFeedback): [AutomationMatchedJob!]!
  """Admin only. User-wide banned companies for job automations."""
  automationCompanyBans: [AutomationCompanyBan!]!
  """Admin only. Whether a LinkedIn session cookie is saved (never returns the cookie)."""
  linkedInSessionStatus: LinkedInSessionStatus!
  """Admin only. Synced LinkedIn job applications with recruiter status."""
  linkedInApplications(limit: Int = 50, offset: Int = 0): [LinkedInApplication!]!
}

